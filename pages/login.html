<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TABLE | Login</title>

    <link rel="stylesheet" href="../css/login-cadastro.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="../img/logo_icone.png" type="image/x-icon">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="pagina-autenticacao">
    <div class="autenticacao-wrapper">
        <div class="autenticacao-caixa">
            <a href="index.html">
                <img class="logotipo" src="../img/logo_horizontal.png" alt="TABLE">
            </a>
            <h2>Login</h2>

            <form id="form-login">
                <div class="grupo-formulario">
                    <label for="nome">Usuário ou E-mail</label>
                    <div class="grupo-input">
                        <span class="input-icone"><i class="fas fa-user"></i></span>
                        <input type="text" id="nome" name="nome" required placeholder="Digite seu usuário ou e-mail" maxlength="50">
                    </div>
                </div>

                <div class="grupo-formulario">
                    <label for="senha-login">Senha</label>
                    <div class="grupo-input senha-wrapper">
                        <span class="input-icone"><i class="fas fa-lock"></i></span>
                        <input type="password" id="senha-login" name="senha" required placeholder="Digite sua senha" maxlength="50">
                        <i class="fas fa-eye alternar-senha"></i>
                    </div>
                    <span id="senha-login-erro-msg" class="erro-validacao"></span>
                </div>

                <button type="submit" id="login-submit-btn" class="botao-gradiente botao-cheio">Login</button>

                <p class="autenticacao-link">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
            </form>
        </div>
    </div>

    <script src="../js/script.js" defer></script>
    <script src="../js/auth-simulado.js" defer></script>
</body>

</html>
